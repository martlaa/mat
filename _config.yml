title: Koolimatemaatika
description: Matemaatika õpetamise, õpetajakoolituse ja uurimise kohtumispaik.
url: "https://martlaa.github.io"
baseurl: "/mat"
lang: et
timezone: Europe/Tallinn
markdown: kramdown
permalink: pretty
collections:
  kogumikud:
    output: true
    permalink: /artiklid/koolimatemaatika/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: kogumikud
    values:
      layout: kogumik
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
